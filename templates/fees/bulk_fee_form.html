{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="container">
    <h2>{{ title }}</h2>
    <p class="text-muted">{% trans 'Create fees for all students in a selected class.' %}</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">{% trans 'Create Fees' %}</button>
            <a href="{% url 'fee_list' %}" class="btn btn-secondary">{% trans 'Cancel' %}</a>
        </div>
    </form>
</div>
{% endblock %}
