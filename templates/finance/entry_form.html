{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>{{ title }}</h2>
        <a href="{% url cancel_url %}" class="btn btn-outline-secondary">{% trans 'Back' %}</a>
    </div>
    <div class="card p-4">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">{% trans 'Save' %}</button>
        </form>
    </div>
</div>
{% endblock %}
